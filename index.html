<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NameSpin.io</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="logo">
    <div class="logo-icon">
      <svg viewBox="0 0 36 36">
        <path d="M18 2 A16 16 0 0 1 34 18 L18 18 Z" fill="#e53935"/>
        <path d="M34 18 A16 16 0 0 1 18 34 L18 18 Z" fill="#1e88e5"/>
        <path d="M18 34 A16 16 0 0 1 2 18 L18 18 Z" fill="#43a047"/>
        <path d="M2 18 A16 16 0 0 1 18 2 L18 18 Z" fill="#fdd835"/>
        <circle cx="18" cy="18" r="4" fill="#fff"/>
      </svg>
    </div>
    NameSpin.io
  </div>
  <div class="container">
    <div class="wheel-section">
      <div class="wheel-container">
        <div class="pointer"></div>
        <canvas id="wheel" width="850" height="850"></canvas>
        <button class="center-btn" id="spinBtn">SPIN</button>
      </div>
    </div>

    <div class="sidebar">
      <div class="tabs">
        <button class="tab active" data-tab="entries">Entries <span class="tab-count" id="entryCount">(15)</span></button>
        <button class="tab" data-tab="history">History <span class="tab-count" id="historyCount">(0)</span></button>
      </div>

      <div class="tab-content active" id="entriesTab">
        <textarea class="entries-textarea" id="entriesText" placeholder="Enter names, one per line..."></textarea>
        <div class="hint">One name per line</div>

        <div class="spin-time">
          <label>Spin time:</label>
          <div class="time-options">
            <button class="time-btn" data-time="5000">5s</button>
            <button class="time-btn active" data-time="10000">10s</button>
            <button class="time-btn" data-time="15000">15s</button>
          </div>
        </div>
      </div>

      <div class="tab-content" id="historyTab">
        <div class="history-list" id="historyList">
          <div class="history-empty">No spins yet</div>
        </div>
        <button class="clear-history" id="clearHistory">Clear history</button>
      </div>
    </div>
  </div>

  <footer class="footer">
    This app is free and open-source. <a href="https://github.com/jackgleeson/namespin.io" target="_blank">View on GitHub</a>
    <div class="footer-privacy">No data is saved — your name lists are completely private.</div>
  </footer>

  <div class="winner-modal" id="winnerModal">
    <div class="winner-content">
      <h2>Winner!</h2>
      <div class="winner-name" id="winnerName"></div>
      <button id="closeModal">OK</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
